<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset CatWords Progress</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8f5fa;font-family:Anuphan,Arial,sans-serif;color:#304657}.card{background:#fffdfa;border-radius:22px;padding:32px;text-align:center;box-shadow:0 13px 32px #36687a18;max-width:360px}.cat{font-size:58px}.primary{border:0;border-radius:11px;background:#23465d;color:#fff;padding:12px 20px;font-size:14px;cursor:pointer}.muted{color:#899aa3;font-size:13px}</style></head><body><main class="card"><div class="cat">🐱</div><h1>เริ่มต้นใหม่</h1><p class="muted">ล้าง XP, Fish Coins, Quiz Score และสถานะการเรียน เพื่อทดลองในฐานะผู้เรียนใหม่</p><button class="primary" id="reset">Reset Progress</button></main><script>document.getElementById('reset').onclick=()=>{localStorage.removeItem('catwords-mvp-progress');localStorage.removeItem('catwords-progress');alert('รีเซ็ตข้อมูลเรียบร้อยแล้ว');location.href='index.html'};</script></body></html>
