<style>
  .cats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .cat { background:var(--surface); border-radius:16px; padding:17px; text-align:center; cursor:pointer; transition:transform .2s, box-shadow .2s; }
  .cat:hover:not(.locked) { transform:translateY(-3px); box-shadow:var(--shadow); }
  .cat-avatar {
    width:96px;
    height:96px;
    border-radius:22px;
    display:grid;
    place-items:center;
    background:var(--peach-soft);
    font-size:38px;
    margin:auto auto 10px;
    overflow:hidden;
  }
  .cat-avatar img { width:100%; height:100%; object-fit:cover; object-position:center 12%; }
  .cat b, .cat small, .cat em { display:block; }
  .cat b { font:700 13px var(--font-display); }
  .cat small { font-size:10px; color:var(--muted); margin-top:2px; }
  .cat em { font-style:normal; font-size:10px; color:var(--mint-text); margin-top:9px; font-weight:700; }
  .cat.locked { opacity:.55; cursor:default; }
  .cat.locked .cat-avatar span { filter:grayscale(.9); opacity:.55; }
  .cat.locked em { color:var(--peach-strong); }

  .family-detail { display:flex; align-items:center; gap:24px; margin-top:18px; }
  .family-detail .fd-image { width:150px; flex:none; }
  .family-detail .fd-image img { width:100%; border-radius:18px; display:block; background:var(--surface-soft); }
  .family-detail h2 { font:700 22px var(--font-display); margin:0 0 4px; }
  .family-detail .role { color:var(--peach-text); font-size:11px; font-weight:700; letter-spacing:1px; }
  .family-detail p { font-size:13px; color:var(--muted); line-height:1.7; margin:10px 0 14px; max-width:480px; }
  .family-detail .fd-actions { display:flex; gap:10px; align-items:center; }
  .family-detail .fav { font-size:12px; color:var(--muted); }

  @media (max-width:900px) { .cats { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:650px) {
    .family-detail { flex-direction:column; text-align:center; }
    .family-detail .fd-image { width:130px; }
    .family-detail p { max-width:100%; }
    .family-detail .fd-actions { justify-content:center; }
  }
</style>
